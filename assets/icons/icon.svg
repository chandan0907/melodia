<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c111e"/>
      <stop offset="100%" stop-color="#07060a"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#07060a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  
  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="200" fill="#0f0c13" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Center Label -->
  <circle cx="256" cy="256" r="80" fill="url(#neon)"/>
  <circle cx="256" cy="256" r="28" fill="#07060a" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Modern Stylized B / M mark -->
  <path d="M 235 220 L 235 292 M 235 220 C 255 220, 268 228, 268 240 C 268 250, 258 256, 245 256 C 260 256, 272 262, 272 274 C 272 288, 256 292, 235 292" 
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
